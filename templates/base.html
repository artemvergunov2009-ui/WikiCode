<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WikiCode — справочник для начинающих программистов{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="/" class="logo">Wiki<span>Code</span></a>
            <nav class="nav">
                <a href="/" {% if active == 'home' %}class="active"{% endif %}>Главная</a>
                <a href="/catalog" {% if active == 'catalog' %}class="active"{% endif %}>Справочник</a>
                <a href="/favorites" {% if active == 'favorites' %}class="active"{% endif %}>Избранное</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
        </div>
    </footer>
</body>
</html>
